apiVersion: apps/v1
kind: Deployment
metadata:
  name: ride-matching
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ride-matching
  template:
    metadata:
      labels:
        app: ride-matching
    spec:
      containers:
      - name: ride-matching
        image: gcr.io/uber-auto-scaling/ride-matching:latest
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"
